version: '3.8'

services:
  dev:
    build: .
    container_name: ow-translator-dev
    environment:
      - GLM_API_KEY=${GLM_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GLM_API_KEY_FILE=/secrets/glm_api_key
      - DEEPSEEK_API_KEY_FILE=/secrets/deepseek_api_key
    volumes:
      - .:/app
      - ./secrets:/secrets:ro
    stdin_open: true
    tty: true
